name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - "kubernetes/**"

permissions:
  id-token: write
  contents: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Import existing SG rules into Terraform state
        working-directory: terraform
        env:
          TF_VAR_db_password_catalog: ${{ secrets.DB_PASSWORD_CATALOG }}
          TF_VAR_db_password_orders: ${{ secrets.DB_PASSWORD_ORDERS }}
        run: |
          CLUSTER_SG=$(aws eks describe-cluster \
            --name project-bedrock-cluster \
            --region us-east-1 \
            --query 'cluster.resourcesVpcConfig.clusterSecurityGroupId' \
            --output text 2>/dev/null || echo "")

          if [ -z "$CLUSTER_SG" ] || [ "$CLUSTER_SG" = "None" ]; then
            echo "Cluster not found — skipping SG rule import"
            exit 0
          fi
          echo "Cluster SG: $CLUSTER_SG"

          import_if_needed() {
            local TF_ADDR="$1"
            local PORT="$2"
            if terraform state show "$TF_ADDR" > /dev/null 2>&1; then
              echo "$TF_ADDR already in state, skipping"
              return
            fi
            local IMPORT_ID="${CLUSTER_SG}_ingress_tcp_${PORT}_${PORT}_0.0.0.0/0"
            echo "Importing $TF_ADDR → $IMPORT_ID"
            terraform import "$TF_ADDR" "$IMPORT_ID" || \
              echo "Rule not found in AWS — terraform apply will create it"
          }

          import_if_needed "module.eks.aws_security_group_rule.cluster_http_ingress" 80
          import_if_needed "module.eks.aws_security_group_rule.cluster_https_ingress" 443

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_password_catalog: ${{ secrets.DB_PASSWORD_CATALOG }}
          TF_VAR_db_password_orders: ${{ secrets.DB_PASSWORD_ORDERS }}
        run: terraform apply -auto-approve

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name project-bedrock-cluster --region us-east-1

      - name: Wait for nodes to be ready
        run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - name: Install AWS Load Balancer Controller
        working-directory: terraform
        run: |
          LBC_ROLE_ARN=$(terraform output -raw lbc_role_arn)
          VPC_ID=$(terraform output -raw vpc_id)
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=project-bedrock-cluster \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${LBC_ROLE_ARN}" \
            --set region=us-east-1 \
            --set vpcId=${VPC_ID} \
            --wait \
            --timeout 10m || {
              echo "=== LBC pod status ==="
              kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
              echo "=== LBC pod logs ==="
              kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 || true
              exit 1
            }
          kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s

      - name: Apply Namespace and RBAC
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/rbac.yaml

      - name: Create Database Secrets
        run: |
          CATALOG_RAW=$(aws secretsmanager get-secret-value \
            --secret-id project-bedrock/catalog-db-credentials \
            --query SecretString --output text)
          CATALOG_HOST=$(echo "$CATALOG_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':3306')")
          CATALOG_USER=$(echo "$CATALOG_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['username'])")
          CATALOG_PASS=$(echo "$CATALOG_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['password'])")

          kubectl create secret generic catalog-db-secret \
            --namespace retail-app \
            --from-literal=endpoint="$CATALOG_HOST" \
            --from-literal=username="$CATALOG_USER" \
            --from-literal=password="$CATALOG_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

          ORDERS_RAW=$(aws secretsmanager get-secret-value \
            --secret-id project-bedrock/orders-db-credentials \
            --query SecretString --output text)
          ORDERS_HOST=$(echo "$ORDERS_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':5432')")
          ORDERS_USER=$(echo "$ORDERS_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['username'])")
          ORDERS_PASS=$(echo "$ORDERS_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['password'])")

          kubectl create secret generic orders-db-secret \
            --namespace retail-app \
            --from-literal=endpoint="$ORDERS_HOST" \
            --from-literal=username="$ORDERS_USER" \
            --from-literal=password="$ORDERS_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Retail Store App
        run: kubectl apply -k kubernetes/retail-app/ --timeout=600s

      - name: Annotate Carts ServiceAccount for IRSA
        working-directory: terraform
        run: |
          CART_ROLE_ARN=$(terraform output -raw cart_irsa_role_arn)
          kubectl annotate serviceaccount carts \
            --namespace retail-app \
            "eks.amazonaws.com/role-arn=${CART_ROLE_ARN}" \
            --overwrite
          kubectl rollout restart deployment/carts -n retail-app

      - name: Apply Ingress
        run: kubectl apply -f kubernetes/ingress.yaml

      - name: Install NGINX Ingress Controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --set 'controller.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-type=external' \
            --set 'controller.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-nlb-target-type=ip' \
            --set 'controller.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-scheme=internet-facing' \
            --wait \
            --timeout 5m

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m

      - name: Apply ClusterIssuer
        run: kubectl apply -f kubernetes/cert-manager/cluster-issuer.yaml

      - name: Deploy TLS Ingress
        run: |
          echo "Waiting for NLB hostname..."
          NLB_HOSTNAME=""
          for i in $(seq 1 20); do
            NLB_HOSTNAME=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$NLB_HOSTNAME" ]; then
              echo "NLB hostname: $NLB_HOSTNAME"
              break
            fi
            echo "  attempt $i/20 — retrying in 15s"
            sleep 15
          done

          if [ -z "$NLB_HOSTNAME" ]; then
            echo "ERROR: NLB hostname not available after timeout"
            exit 1
          fi

          echo "Resolving NLB hostname to IP..."
          NIP_IP=""
          for i in $(seq 1 10); do
            NIP_IP=$(dig +short "$NLB_HOSTNAME" A | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$NIP_IP" ]; then
              echo "Resolved IP: $NIP_IP"
              break
            fi
            echo "  attempt $i/10 — retrying in 15s"
            sleep 15
          done

          if [ -z "$NIP_IP" ]; then
            echo "ERROR: Could not resolve NLB hostname to IP"
            exit 1
          fi

          export NIP_IO_DOMAIN="${NIP_IP}.nip.io"
          echo "nip.io domain: https://${NIP_IO_DOMAIN}"
          envsubst < kubernetes/ingress-tls.yaml | kubectl apply -f -
          echo "NIP_IO_DOMAIN=${NIP_IO_DOMAIN}" >> $GITHUB_ENV

      - name: Configure CoreDNS split DNS
        run: |
          NGINX_CLUSTER_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='{.spec.clusterIP}')
          echo "NGINX ClusterIP: $NGINX_CLUSTER_IP  nip.io domain: $NIP_IO_DOMAIN"

          kubectl get configmap coredns -n kube-system \
            -o jsonpath='{.data.Corefile}' > /tmp/corefile.txt

          python3 scripts/patch_coredns.py "$NGINX_CLUSTER_IP" "$NIP_IO_DOMAIN"

          kubectl create configmap coredns \
            --from-file=Corefile=/tmp/corefile_new.txt \
            -n kube-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/coredns -n kube-system
          kubectl rollout status deployment/coredns -n kube-system --timeout=90s

      - name: Issue TLS Certificate
        run: |
          READY=$(kubectl get certificate retail-store-tls -n retail-app \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
          if [ "$READY" = "True" ]; then
            echo "Certificate already Ready — skipping reissuance"
          else
            echo "Certificate not ready — triggering reissuance"
            kubectl delete certificate retail-store-tls -n retail-app 2>/dev/null || true
            kubectl delete orders.acme.cert-manager.io,challenges.acme.cert-manager.io \
              -n retail-app --all 2>/dev/null || true
            echo "Waiting for certificate to be issued..."
            for i in $(seq 1 24); do
              READY=$(kubectl get certificate retail-store-tls -n retail-app \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
              if [ "$READY" = "True" ]; then
                echo "Certificate issued successfully"
                break
              fi
              echo "  attempt $i/24 — retrying in 15s"
              sleep 15
            done
          fi
          kubectl get certificate retail-store-tls -n retail-app

      - name: Wait for App
        run: |
          kubectl rollout status deployment/ui -n retail-app --timeout=300s || true
          echo "--- ALB HTTP Ingress ---"
          kubectl get ingress retail-store-ingress -n retail-app
          echo "--- NGINX TLS Ingress ---"
          kubectl get ingress retail-store-ingress-tls -n retail-app

      - name: Generate grading.json
        working-directory: terraform
        run: terraform output -json > ../grading.json

      - name: Commit grading.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grading.json
          git diff --staged --quiet || git commit -m "chore: update grading.json [skip ci]"
          git push origin HEAD:main
