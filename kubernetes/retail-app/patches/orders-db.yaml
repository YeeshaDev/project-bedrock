apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    spec:
      containers:
        - name: orders
          env:
            - name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
              value: postgres
            - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: endpoint
            - name: RETAIL_ORDERS_PERSISTENCE_NAME
              value: orders
            - name: RETAIL_ORDERS_PERSISTENCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: username
            - name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: password
