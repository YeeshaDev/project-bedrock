apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
spec:
  template:
    spec:
      containers:
        - name: carts
          env:
            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: dynamodb
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
              value: project-bedrock-carts
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
              value: "false"
            # Empty string disables the in-cluster local endpoint override; SDK uses AWS_REGION env var
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT
              value: ""
            # Clear fake credentials from ConfigMap so IRSA (via SA annotation) takes over
            - name: AWS_ACCESS_KEY_ID
              value: ""
            - name: AWS_SECRET_ACCESS_KEY
              value: ""
